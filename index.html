  <style>
  
  
    /*	Farbdefinition der Seite.		*/
	   
    :root {
      --bg: #0f1115;						/*	Seitenhintergrund				*/
      --surface: #14171c;					/*	1. Grundfarbe					*/
	  --surface-2: #1a1d23;					/*	2. Grundfarbe					*/
      --code: #272c34;						/*	Hintergrundfarbe von Code-Zitaten	*/
      --line: #3a414b;						/*	Rahmen						*/
      --text: #cfd4dc;						/*	1. Textfarbe					*/
      --muted: #a6afbd;						/*	2. Textfarbe					*/
	  --green: #00e676;
	  --greenbg: #1d583b;
	  --turquoise: #00e5c3;
	  --turquoisebg: #1d584f;
	  --cyan: #00b8ff;
	  --cyanbg: #1d4858;
	  --blue: #2979ff;
	  --bluebg: #1d3358;
	  --yellow: #ffea00;
	  --yellowbg: #58531d;
	  --red: #ff1744;
	  --redbg: #581d29;
	  --pink: #ff2d95;
	  --pinkbg: #581d3a;
	  --orange: #ff6d00;
	  --orangebg: #58361d;
	  --purple: #7c4dff;
	  --purplebg: #2d1d58;
      --shadow: 0 16px 40px rgba(0, 0, 0, .28);
	
	
	/*	Weitere Farben der Seite		*/	 
	
	/*	Allgemein		*/
	  
      --bg-glow: rgba(214, 239, 74, .14);       	/*	leuchtender Fleck oben links im Hintergrund (rgba = Farbe + Deckkraft)	*/
      --link: var(--blue);                    	 	/*	Links														*/
      --link-hover: var(--yellow);          		/*	Links beim Darüberfahren										*/
      --ins-underline: var(--muted);             	/*	Unterstreichung bei <ins>										*/
      --about-text: var(--muted);               	/*	großer Text oben (About)										*/
      --intro-text: var(--text);                	/*	Einleitungstext												*/
      --loading-text: var(--muted);             	/*	"wird geladen"-Text											*/
      --quote-border: var(--line);              	/*	Linie links bei Zitaten										*/
      --quote-text: var(--muted);               	/*	Text in Zitaten												*/


	/*	Code (Inline-Code und Codeblöcke)	*/

      --code-bg: var(--code);
      --code-border: var(--line);


	/*	Sprach-Flaggen		*/
	  
      --flag-hover-color: var(--green);			/*	Rahmen der Flagge beim Darüberfahren	*/
      --flag-selected-color: var(--yellow);		/*	Rahmen der ausgewählten Flagge	*/
      /*	Überschriften im Kästchen: "# " = zweite #-Überschrift der README (neben dem Demo-GIF), "##" = alle Abschnitts-Überschriften	*/
      --heading-color: var(--text);			/*	Textfarbe der Überschriften (beide Arten)	*/
      --heading-font-size: clamp(1.6rem, 3vw, 2.1rem);	/*	Schriftgröße	*/
      --heading-weight: 700;				/*	Schriftstärke	*/
      --heading-letter-spacing: normal;		/*	Buchstabenabstand, z. B. .06em	*/
      --heading-transform: none;			/*	none / uppercase / capitalize	*/
      --heading-align: center;				/*	left / center / right	*/
      --heading-padding: 10px 16px;			/*	Innenabstand des Kästchens (oben/unten  links/rechts)	*/
      --heading-dots-opacity: var(--dots-opacity);	/*	Stärke der blue dots im Kästchen	*/

      --h1-color: var(--heading-color);		/*	"# "-Überschrift: Textfarbe	*/
      --h1-border: var(--stat-border);		/*	"# "-Überschrift: Rahmen	*/
      --h1-bg-top: var(--stat-bg-top);		/*	"# "-Überschrift: Hintergrund oben	*/
      --h1-bg-bottom: var(--stat-bg-bottom);	/*	"# "-Überschrift: Hintergrund unten	*/

      --h2-color: var(--heading-color);		/*	"##"-Überschriften: Textfarbe	*/
      --h2-border: var(--stat-border);		/*	"##"-Überschriften: Rahmen	*/
      --h2-bg-top: var(--stat-bg-top);		/*	"##"-Überschriften: Hintergrund oben	*/
      --h2-bg-bottom: var(--stat-bg-bottom);	/*	"##"-Überschriften: Hintergrund unten	*/

      --section-gap: 56px;					/*	Senkrechter Abstand zwischen den ##-Abschnitten der README (Ende des Inhalts → nächste Überschrift)	*/
      --feature-gap: 14px;					/*	Abstand zwischen den Feature-Kästchen; gilt auch für die Sprachbox (Pill-Pill, Pill-Rand) und zwischen Einleitung und Demo-GIF	*/
      --flag-height: 26px;					/*	Höhe der Flaggen (die Breite folgt, Verhältnis 3:5)	*/


	/*	Sprachnamen neben den Flaggen (ENGLISH / DEUTSCH / РУССКИЙ)	*/

      --lang-color: var(--stat-label);			/*	Standardfarbe aller drei (wie die Überschriften der Live-Zeile)	*/
      --lang-hover-color: var(--flag-hover-color);	/*	beim Darüberfahren mit der Maus	*/
      --lang-selected-color: var(--flag-selected-color);	/*	ausgewählte Sprache	*/
      --lang-glow-size: 10px;				/*	Stärke des Leuchtens bei Hover und Auswahl (0px = kein Leuchten)	*/

      --lang-en-color: var(--lang-color);			/*	Englisch einzeln	*/
      --lang-en-hover-color: var(--lang-hover-color);
      --lang-en-selected-color: var(--lang-selected-color);

      --lang-de-color: var(--lang-color);			/*	Deutsch einzeln	*/
      --lang-de-hover-color: var(--lang-hover-color);
      --lang-de-selected-color: var(--lang-selected-color);

      --lang-ru-color: var(--lang-color);			/*	Russisch einzeln	*/
      --lang-ru-hover-color: var(--lang-hover-color);
      --lang-ru-selected-color: var(--lang-selected-color);
      --flag-focus-outline: var(--line);            	/*	Fokus-Rahmen (Tastatur)							*/
      --flag-inner-ring: rgba(255, 255, 255, .28);		/*	feiner Innenrand der Flaggen 						*/



	/*	Demo-GIF-Rahmen	*/

      --media-bg: var(--bg);
      --media-border: var(--line);


	/*	Hinweis-Boxen (> [!NOTE] usw. aus der README)	*/

      --alert-important-bg: var(--orangebg);
      --alert-important-border: var(--orange);
      --alert-important-label: var(--orange);
      --alert-warning-bg: var(--redbg);
      --alert-warning-border: var(--red);
      --alert-warning-label: var(--red);
      --alert-note-bg: var(--purplebg);            	/*	gilt für NOTE und TIP		*/
      --alert-note-border: var(--purple);
      --alert-note-label: var(--purple);
      --alert-caution-bg: var(--yellowbg);
      --alert-caution-border: var(--yellow);
      --alert-caution-label: var(--yellow);


	/*	Fehlermeldung (README konnte nicht geladen werden)	*/

      --error-bg: var(--redbg);
      --error-border: var(--red);


	/*	Strukturhinweis (falls README-Überschriften fehlen)		*/

      --note-bg: var(--redbg);
      --note-border: var(--red);
      --note-text: var(--text);


	/*	Favicon (Krone im Browser-Tab)	*/

      --favicon-bg: var(--bg);
      --favicon-line: var(--green);


	/*	Kopfbild (GitHub Page/header.png) und Sprachbox oben rechts darin	*/

      --hero-bg-top: var(--surface);			/*	Hintergrund des Kopfbilds oben	*/
      --hero-bg-bottom: var(--surface-2);		/*	Hintergrund des Kopfbilds unten (gleicher Wert = einfarbig)	*/
      --hero-border: var(--line);			/*	Rahmen um das Kopfbild	*/
      --hero-invert: 1;					/*	1 = Farben umgekehrt (weiße Linien auf dunklem Grund), 0 = Originalfarben (hell)	*/
      --hero-opacity: .9;					/*	Stärke des Bilds (0 = unsichtbar, 1 = voll)	*/
      --hero-blend: screen;					/*	screen = nur die hellen Linien zeigen sich. normal = Bild liegt komplett darüber	*/
      --hero-fade-start: 62%;				/*	Ab hier blendet das Bild nach unten aus (100% = kein Ausblenden)	*/

      --lang-box-bg-top: var(--stat-bg-top);		/*	Sprachbox: Hintergrund oben (Standard: wie die Live-Zeile)	*/
      --lang-box-bg-bottom: var(--stat-bg-bottom);	/*	Sprachbox: Hintergrund unten	*/
      --lang-box-border: var(--stat-border);		/*	Sprachbox: Rahmen	*/
      --lang-box-linemap-opacity: var(--linemap-opacity);	/*	Sprachbox: Stärke des Linienmusters	*/
      --lang-switch-direction: row;			/*	row = Pills nebeneinander, column = untereinander	*/
      --lang-pill-border: var(--stat-pill-border);	/*	Rahmen der Sprach-Pills (wie bei den Branch-Pills)	*/


	/*	Fehlermeldung: toter Smiley links neben dem Text	*/

      --error-icon-color: var(--error-border);	/*	Farbe des Smileys	*/
      --error-icon-size: 64px;			/*	Größe des Smileys	*/


	/*	Farben für Zeile mit Stars / Branches / Latest release / Last change	*/
	
      --stat-bg-top: var(--surface);			/*	Standard für alle 4 Kästchen: Hintergrund oben							*/
      --stat-bg-bottom: var(--surface-2);		/*	Standard für alle 4 Kästchen: Hintergrund unten (gleicher Wert = einfarbig)	*/
      --stat-border: var(--line);               /*	Rahmen														*/
      --stat-border-hover: var(--green);		/*	Rahmen beim Darüberfahren										*/
      --stat-label: var(--muted);				/*	kleine Beschriftung (STARS ...)										*/
      --card-heading-align: left;			/*	Feature-Kästchen: ###-Überschrift left / center / right	*/
      --card-text-align: justify;			/*	Feature-Kästchen: übriger Inhalt justify (Blocksatz) / left / center / right	*/
      --content-text-align: var(--card-text-align);	/*	How to use + Vergleich (Pro/Contra): Inhalt justify (Blocksatz) / left / center / right	*/
      --stat-align: center;				/*	Live-Zeile: Text left / center / right	*/
      --stat-justify: center;				/*	Live-Zeile: Überschrift mit Symbol und Branch-Pills flex-start / center / flex-end (passend zu oben)	*/
      --stat-icon: var(--stat-label);			/*	Symbole vor STARS / BRANCHES / LATEST RELEASE / LAST CHANGE	*/
      --stat-icon-star-edge: #e8941a;			/*	Stern bei Stars: Rand (die Füllung ist ein gelber Verlauf wie beim "Starred"-Stern auf GitHub, siehe linearGradient im Kästchen)	*/
      --stat-icon-release: #3fb950;			/*	Release-Symbol (grün wie das "Latest" auf GitHub)	*/
      --stat-cta: var(--stat-icon-release);		/*	"Download here!" in der Überschrift des Release-Kästchens (gleicher Grünton wie das Release-Symbol)	*/
      --stat-value: var(--text);				/*	Wert (Zahl, Release, Datum)										*/
      --stat-pill-border: var(--line);			/*	Rahmen der Branch-Namen										*/
      --stat-pill-text: var(--text);			/*	Text der Branch-Namen											*/


	/*
		Live-Zeile: einzeln pro Kästchen (Farbverlauf von oben nach unten)
		1 = Stars, 2 = Latest release, 3 = Branches, 4 = Last change
		border = Rahmen, bg-top / bg-bottom = Hintergrund oben / unten
	*/

      --stat-1-border: var(--stat-border);
      --stat-1-bg-top: var(--stat-bg-top);
      --stat-1-bg-bottom: var(--stat-bg-bottom);

      --stat-2-border: var(--stat-border);
      --stat-2-bg-top: var(--stat-bg-top);
      --stat-2-bg-bottom: var(--stat-bg-bottom);

      --stat-3-border: var(--stat-border);
      --stat-3-bg-top: var(--stat-bg-top);
      --stat-3-bg-bottom: var(--stat-bg-bottom);

      --stat-4-border: var(--stat-border);
      --stat-4-bg-top: var(--stat-bg-top);
      --stat-4-bg-bottom: var(--stat-bg-bottom);
	  

	/*
		Farben für Feature-Kästchen: Standardwerte für alle Karten
		Gelten für jede Karte, bei der unten nichts Eigenes steht
		(auch für Karte 10 und höher).
	*/

      --card-bg-top: var(--surface);    		/*	Hintergrund oben						*/
      --card-bg-bottom: var(--surface-2);  		/*	Hintergrund unten (gleicher Wert = einfarbig)	*/
      --card-border: var(--line);               /*	Rahmen								*/
      --card-accent: var(--code);				/*	Linie oben + Überschrift					*/


	/*
		Farben für Feature-Kästchen: einzeln pro Karte
		accent = Linie oben + Überschrift, border = Rahmen,
		bg-top / bg-bottom = Hintergrund oben / unten.
	*/
    
      --card-1-accent: var(--blue);
      --card-1-border: var(--card-border);
      --card-1-bg-top: var(--card-bg-top);
      --card-1-bg-bottom: var(--bluebg);

      --card-2-accent: var(--blue);
      --card-2-border: var(--card-border);
      --card-2-bg-top: var(--card-bg-top);
      --card-2-bg-bottom: var(--bluebg);

      --card-3-accent: var(--cyan);
      --card-3-border: var(--card-border);
      --card-3-bg-top: var(--card-bg-top);
      --card-3-bg-bottom: var(--cyanbg);

      --card-4-accent: var(--cyan);
      --card-4-border: var(--card-border);
      --card-4-bg-top: var(--card-bg-top);
      --card-4-bg-bottom: var(--cyanbg);

      --card-5-accent: var(--cyan);
      --card-5-border: var(--card-border);
      --card-5-bg-top: var(--card-bg-top);
      --card-5-bg-bottom: var(--cyanbg);

      --card-6-accent: var(--turquoise);
      --card-6-border: var(--card-border);
      --card-6-bg-top: var(--card-bg-top);
      --card-6-bg-bottom: var(--turquoisebg);

      --card-7-accent: var(--turquoise);
      --card-7-border: var(--card-border);
      --card-7-bg-top: var(--card-bg-top);
      --card-7-bg-bottom: var(--turquoisebg);

      --card-8-accent: var(--green);
      --card-8-border: var(--card-border);
      --card-8-bg-top: var(--card-bg-top);
      --card-8-bg-bottom: var(--greenbg);

      --card-9-accent: var(--green);
      --card-9-border: var(--card-border);
      --card-9-bg-top: var(--card-bg-top);
      --card-9-bg-bottom: var(--greenbg);


	/*	Anleitung 		*/
	  
      --step-bg: var(--surface-2);			/*	Kreis mit der Schrittnummer	*/
      --step-text: var(--muted);			/*	Zahl im Kreis				*/
      --shot-border: var(--line);			/*	Rahmen um Screenshots		*/


	/*	Vergleich (Pro / Con)		*/
	  
      --compare-bg-top: var(--surface);			/*	Standard für Pro und Con: Hintergrund oben						*/
      --compare-bg-bottom: var(--surface-2);	/*	Standard für Pro und Con: Hintergrund unten (gleicher Wert = einfarbig)	*/
      --compare-border: var(--line);
      --compare-pro: var(--green);				/*	Pro: Linie oben + Überschrift	*/
      --compare-con: var(--red);				/*	Con: Linie oben + Überschrift	*/


    /*	Pro und Con einzeln (Farbverlauf von oben nach unten)	*/
	
      --compare-pro-border: var(--compare-border);
      --compare-pro-bg-top: var(--compare-bg-top);
      --compare-pro-bg-bottom: var(--greenbg);

      --compare-con-border: var(--compare-border);
      --compare-con-bg-top: var(--compare-bg-top);
      --compare-con-bg-bottom: var(--redbg);


	/*	Coming-Soon-Liste	*/
	  
      --soon-bg: var(--surface-2);
      --soon-border: var(--line);
      --soon-marker: var(--muted);		/*	das Zeichen ▸ vor jedem Eintrag	*/



	/*	dunkles Thema		*/


	/*	Linienmuster als Hintergrund der Kästchen (Live-Zeile, Feature-Karten, Vergleich)	*/
	/*	Bild: linemap.png (liegt im Ordner "GitHub Page" neben der index.html)					*/

      --linemap-image: url("GitHub%20Page/linemap.png");		/*	Das Bild. Mit "none" schaltest du das Muster überall ab	*/
      --linemap-size: auto;					/*	Größe der Kachel: auto = Originalgröße (514px), z. B. 300px = kleiner	*/
      --linemap-blend: screen;				/*	screen = nur die hellen Linien zeigen sich. normal = Bild liegt komplett darüber	*/
      --linemap-opacity: .05;				/*	Stärke der Linien (0 = unsichtbar, 1 = voll). Im Spiel: .05	*/
      --stat-linemap-opacity: var(--linemap-opacity);		/*	nur Live-Zeile	*/
      --card-linemap-opacity: var(--linemap-opacity);		/*	nur Feature-Karten	*/
      --compare-linemap-opacity: var(--linemap-opacity);	/*	nur Vergleich (Pro / Con)	*/


	/*	Punktmuster als Hintergrund der Branch-Pills und der Hinweisboxen	*/
	/*	Bild: bluedots.png (liegt im Ordner "GitHub Page" neben der index.html)				*/

      --dots-image: url("GitHub%20Page/bluedots.png");		/*	Das Bild. Mit "none" schaltest du das Muster überall ab	*/
      --dots-size: auto;					/*	Größe der Kachel: auto = Originalgröße (512px), z. B. 256px = Punkte halb so groß	*/
      --dots-blend: screen;				/*	screen = nur die hellen Punkte zeigen sich. normal = Bild liegt komplett darüber	*/
      --dots-opacity: .04;					/*	Stärke der Punkte (0 = unsichtbar, 1 = voll). Im Spiel: .04	*/
      --pill-dots-opacity: var(--dots-opacity);		/*	nur Branch-Pills	*/
      --alert-dots-opacity: var(--dots-opacity);		/*	nur Hinweisboxen	*/

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
      background:
        radial-gradient(900px 420px at 8% -10%, var(--bg-glow), transparent 55%),
        var(--bg);
    }

    a { color: var(--link); }
    a:hover { color: var(--link-hover); }

    /* Leerzeichen in Inline-Code: feste Breite, kein Blocksatz-Dehnen */
    code .sp { display: inline-block; width: 1ch; overflow: hidden; white-space: pre; vertical-align: bottom; }
    pre, pre code { text-align: left; }

    code {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .86em;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 5px;
      padding: .05em .35em;
    }

    pre {
      overflow-x: auto;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    pre code { border: 0; background: transparent; padding: 0; }

    ins { text-decoration-color: var(--ins-underline); text-underline-offset: 3px; }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 72px;
    }

    /* Die erste Überschrift steckt im Kopfbild. Im Quelltext bleibt sie für Screenreader und Suchmaschinen stehen. */
    h1 { margin: 0; }

    .subtitle:empty { display: none; }

    /* Kopfbild: gerundete Box wie die Kästchen der Seite. Die Sprachbox liegt unten rechts darin. */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--hero-border);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--hero-bg-top), var(--hero-bg-bottom));
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
      filter: invert(var(--hero-invert));
      opacity: var(--hero-opacity);
      mix-blend-mode: var(--hero-blend);
      -webkit-mask-image: linear-gradient(#000 var(--hero-fade-start), transparent);
      mask-image: linear-gradient(#000 var(--hero-fade-start), transparent);
    }

    /* Sprachbox: Aussehen wie die Kästchen der Live-Zeile (Verlauf, Rahmen, Linienmuster), ohne Überschrift */
    .lang-box {
      position: relative;
      isolation: isolate;
      margin: 0 0 var(--feature-gap);
      padding: var(--feature-gap);
      background: linear-gradient(180deg, var(--lang-box-bg-top), var(--lang-box-bg-bottom));
      border: 1px solid var(--lang-box-border);
      border-radius: 14px;
    }

    .lang-box::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background-image: var(--linemap-image);
      background-size: var(--linemap-size);
      background-repeat: repeat;
      mix-blend-mode: var(--linemap-blend);
      opacity: var(--lang-box-linemap-opacity);
    }

    .lang-switch {
      display: flex;
      flex-direction: var(--lang-switch-direction);
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--feature-gap);
    }

    /* Eine Pill pro Sprache: Flagge + Name. Hintergrund (Punktmuster) und Rahmen wie bei den Branch-Pills. */
    .flag-btn {
      display: inline-flex;
      flex: 1 1 0;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 4px 16px 4px 9px;
      font: inherit;
      line-height: 1;
      border: 1px solid var(--lang-pill-border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
    }

    /* Rahmen um die Flagge: unsichtbar, damit nichts springt. Hover und Auswahl färben ihn. */
    .flag-frame {
      display: block;
      padding: 3px;
      line-height: 0;
      border: 2px solid transparent;
      border-radius: 6px;
      transition: border-color .12s linear;
    }

    .flag-btn .flag-svg {
      display: block;
      height: var(--flag-height);
      width: calc(var(--flag-height) * 5 / 3);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px var(--flag-inner-ring);
    }

    .flag-btn[data-lang="en"] { --ln-color: var(--lang-en-color); --ln-hover: var(--lang-en-hover-color); --ln-selected: var(--lang-en-selected-color); }
    .flag-btn[data-lang="de"] { --ln-color: var(--lang-de-color); --ln-hover: var(--lang-de-hover-color); --ln-selected: var(--lang-de-selected-color); }
    .flag-btn[data-lang="ru"] { --ln-color: var(--lang-ru-color); --ln-hover: var(--lang-ru-hover-color); --ln-selected: var(--lang-ru-selected-color); }

    /* Name der Sprache: Schrift wie die Überschriften der Live-Zeile (.stat-k) */
    .lang-name {
      padding-left: .12em;
      white-space: nowrap;
      line-height: 1;
      color: var(--ln-color);
      transition: color .12s linear, text-shadow .12s linear;
    }

    .flag-btn:hover .lang-name,
    .flag-btn:focus-visible .lang-name {
      color: var(--ln-hover);
      text-shadow: 0 0 var(--lang-glow-size) currentColor;
    }

    .flag-btn.is-active .lang-name {
      color: var(--ln-selected);
      text-shadow: 0 0 var(--lang-glow-size) currentColor;
    }

    .flag-btn:hover .flag-frame,
    .flag-btn:focus-visible .flag-frame {
      border-color: var(--flag-hover-color);
    }

    .flag-btn.is-active .flag-frame {
      border-color: var(--flag-selected-color);
    }

    .flag-btn:focus-visible {
      outline: 2px solid var(--flag-focus-outline);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--feature-gap);
      align-items: start;
      margin-top: var(--feature-gap);
    }

    /* ".intro-copy .about" (statt nur ".about"): sonst überschreibt ".intro-copy p" die About-Farbe */
    .intro-copy .about {
      margin: 0 0 14px;
      color: var(--about-text);
      font-size: 1.14rem;
      line-height: 1.45;
    }

    .intro-copy p { margin: 0 0 12px; color: var(--intro-text); }
    .intro-copy ul, .intro-copy ol { margin: 0 0 12px; padding-left: 1.2rem; color: var(--intro-text); }

    .intro-media {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--media-border);
      background: var(--media-bg);
    }

    .preview-art, .intro-media img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Linienmuster über dem Farbverlauf der Kästchen, unter dem Text (Einstellungen im Farbblock oben) */
    .stat, .card, .compare-col {
      position: relative;
      isolation: isolate;
    }

    .stat::before, .card::before, .compare-col::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background-image: var(--linemap-image);
      background-size: var(--linemap-size);
      background-repeat: repeat;
      mix-blend-mode: var(--linemap-blend);
      opacity: var(--lm-opacity, var(--linemap-opacity));
    }

    .stat { --lm-opacity: var(--stat-linemap-opacity); }
    .card { --lm-opacity: var(--card-linemap-opacity); }
    .compare-col { --lm-opacity: var(--compare-linemap-opacity); }

    .live {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      margin-top: var(--feature-gap);
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .stat {
      flex: 1 0 210px;  /* Breiten der einzelnen Kästchen: siehe #stat-stars / #stat-release unten */
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 84px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, var(--bg-top, var(--stat-bg-top)), var(--bg-bottom, var(--stat-bg-bottom)));
      border: 1px solid var(--bd, var(--stat-border));
      border-radius: 14px;
    }

    #stat-stars { flex: .5 0 105px; }
    #stat-release { flex: 1.5 0 315px; }

    .stat:nth-child(1) { --bd: var(--stat-1-border); --bg-top: var(--stat-1-bg-top); --bg-bottom: var(--stat-1-bg-bottom); }
    .stat:nth-child(2) { --bd: var(--stat-2-border); --bg-top: var(--stat-2-bg-top); --bg-bottom: var(--stat-2-bg-bottom); }
    .stat:nth-child(3) { --bd: var(--stat-3-border); --bg-top: var(--stat-3-bg-top); --bg-bottom: var(--stat-3-bg-bottom); }
    .stat:nth-child(4) { --bd: var(--stat-4-border); --bg-top: var(--stat-4-bg-top); --bg-bottom: var(--stat-4-bg-bottom); }

    a.stat:hover { border-color: var(--stat-border-hover); }

    .stat-k, .lang-name {
      font-family: Rajdhani, "Arial Narrow", sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-k { color: var(--stat-label); }

    /* Kopfzeile eines Kästchens: GitHub-Symbol + Beschriftung */
    .stat { text-align: var(--stat-align); }
    .stat-head { display: flex; align-items: center; justify-content: var(--stat-justify); gap: 7px; white-space: nowrap; }
    .stat-icon { flex: none; width: 15px; height: 15px; fill: var(--stat-icon); }
    .stat-icon-release { fill: none; stroke: var(--stat-icon-release); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .stat-icon-release circle { fill: var(--stat-icon-release); stroke: none; }
    .stat-icon-star { fill: none; }

    /* Hinweis unter dem Release: hier liegt der Download */
    .stat-cta {
      display: inline-flex;
      margin-left: 10px;
      align-items: center;
      gap: 6px;
      color: var(--stat-cta);
      font-family: Rajdhani, "Arial Narrow", sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .stat-cta svg { flex: none; width: 14px; height: 14px; fill: currentColor; }

    /* --ln-scale setzt fitFlags() im Skript: gleicht die Größe der Sprachnamen an,
       damit die Großbuchstaben aller drei gleich hoch sind (Russisch kommt aus einer Ersatzschrift). */
    .lang-name { font-size: calc(.78rem * var(--ln-scale, 1)); }

    .stat strong,
    .stat time {
      color: var(--stat-value);
      font-family: Rajdhani, "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .branch-list { display: flex; flex-wrap: wrap; justify-content: var(--stat-justify); gap: 6px; }

    .branch-list a {
      color: var(--stat-pill-text);
      text-decoration: none;
      border: 1px solid var(--stat-pill-border);
      border-radius: 999px;
      padding: 2px 8px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .75rem;
    }

    .branch-list a:hover { border-color: var(--stat-border-hover); color: var(--stat-border-hover); }

    /* Punktmuster über dem Hintergrund der Pills und Hinweisboxen, unter dem Text (Einstellungen im Farbblock oben) */
    .branch-list a, .flag-btn, .alert {
      position: relative;
      isolation: isolate;
    }

    .branch-list a::before, .flag-btn::before, .alert::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background-image: var(--dots-image);
      background-size: var(--dots-size);
      background-repeat: repeat;
      mix-blend-mode: var(--dots-blend);
      opacity: var(--dots-op, var(--dots-opacity));
    }

    .branch-list a, .flag-btn { --dots-op: var(--pill-dots-opacity); }
    .alert { --dots-op: var(--alert-dots-opacity); }

    .readme-section { margin-top: var(--section-gap); }

    /* Überschriften im Kästchen (Hintergrund wie die Live-Zeile, aber mit blue dots). Variablen: siehe Farbblock oben. */
    .subtitle,
    .readme-section > h2,
    .extra-block > h2 {
      position: relative;
      isolation: isolate;
      margin: 0 0 var(--feature-gap);
      padding: var(--heading-padding);
      font-family: Rajdhani, "Arial Narrow", sans-serif;
      font-size: var(--heading-font-size);
      font-weight: var(--heading-weight);
      letter-spacing: var(--heading-letter-spacing);
      text-transform: var(--heading-transform);
      text-align: var(--heading-align);
      line-height: 1.1;
      color: var(--hc);
      background: linear-gradient(180deg, var(--hbg-top), var(--hbg-bottom));
      border: 1px solid var(--hbd);
      border-radius: 14px;
    }

    .subtitle { --hc: var(--h1-color); --hbd: var(--h1-border); --hbg-top: var(--h1-bg-top); --hbg-bottom: var(--h1-bg-bottom); }
    .readme-section > h2,
    .extra-block > h2 { --hc: var(--h2-color); --hbd: var(--h2-border); --hbg-top: var(--h2-bg-top); --hbg-bottom: var(--h2-bg-bottom); }

    .subtitle::before,
    .readme-section > h2::before,
    .extra-block > h2::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background-image: var(--dots-image);
      background-size: var(--dots-size);
      background-repeat: repeat;
      mix-blend-mode: var(--dots-blend);
      opacity: var(--heading-dots-opacity);
    }

    /*
		Feature-Raster: 6 Spalten.
		Jede Karte belegt "span N" Spalten: span 6 = ganze Zeile, span 3 = Hälfte, span 2 = Drittel.
		Die Zeilen ergeben sich aus der Reihenfolge:
		Karte 1-2 (je 1/2), Karte 3-5 (je 1/3), Karte 6-7 (je 1/2), Karte 8-9 (je 1/2).
		Karten ab Nummer 10 belegen standardmäßig ein Drittel.
	*/
	   
    .cards {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
    }

    .card { grid-column: span 2; }

    .card {
      padding: 16px 16px 12px;
      --accent: var(--card-accent);
      background: linear-gradient(180deg, var(--bg-top, var(--card-bg-top)), var(--bg-bottom, var(--card-bg-bottom)));
      border: 1px solid var(--bd, var(--card-border));
      border-top: 3px solid var(--accent);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .card:nth-child(1) { grid-column: span 3; --accent: var(--card-1-accent); --bd: var(--card-1-border); --bg-top: var(--card-1-bg-top); --bg-bottom: var(--card-1-bg-bottom); }
    .card:nth-child(2) { grid-column: span 3; --accent: var(--card-2-accent); --bd: var(--card-2-border); --bg-top: var(--card-2-bg-top); --bg-bottom: var(--card-2-bg-bottom); }
    .card:nth-child(3) { grid-column: span 2; --accent: var(--card-3-accent); --bd: var(--card-3-border); --bg-top: var(--card-3-bg-top); --bg-bottom: var(--card-3-bg-bottom); }
    .card:nth-child(4) { grid-column: span 2; --accent: var(--card-4-accent); --bd: var(--card-4-border); --bg-top: var(--card-4-bg-top); --bg-bottom: var(--card-4-bg-bottom); }
    .card:nth-child(5) { grid-column: span 2; --accent: var(--card-5-accent); --bd: var(--card-5-border); --bg-top: var(--card-5-bg-top); --bg-bottom: var(--card-5-bg-bottom); }
    .card:nth-child(6) { grid-column: span 3; --accent: var(--card-6-accent); --bd: var(--card-6-border); --bg-top: var(--card-6-bg-top); --bg-bottom: var(--card-6-bg-bottom); }
    .card:nth-child(7) { grid-column: span 3; --accent: var(--card-7-accent); --bd: var(--card-7-border); --bg-top: var(--card-7-bg-top); --bg-bottom: var(--card-7-bg-bottom); }
    .card:nth-child(8) { grid-column: span 3; --accent: var(--card-8-accent); --bd: var(--card-8-border); --bg-top: var(--card-8-bg-top); --bg-bottom: var(--card-8-bg-bottom); }
    .card:nth-child(9) { grid-column: span 3; --accent: var(--card-9-accent); --bd: var(--card-9-border); --bg-top: var(--card-9-bg-top); --bg-bottom: var(--card-9-bg-bottom); }

    .card h3, .compare-col h3, .extra-block h3 {
      margin: 0 0 8px;
      color: var(--accent, var(--green));
      font-family: Rajdhani, "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .card h3 { text-align: var(--card-heading-align); }
    .card p, .card li { text-align: var(--card-text-align); hyphens: auto; }

    /* How to use + Vergleich: Inhalt im Blocksatz, Überschriften bleiben links */
    .howto-grid p, .howto-grid li, .steps li div, .compare-col p, .compare-col li {
      text-align: var(--content-text-align);
      hyphens: auto;
    }

    .card p, .compare-col p, .extra-block p { margin: 0 0 10px; }
    .card ul, .compare-col ul, .extra-block ul { margin: 0 0 10px; padding-left: 1.15rem; }
    .card li + li, .compare-col li + li { margin-top: 4px; }


    /*	How to use: links Text (Schritte), rechts Screenshot mit Hinweis darunter	*/
	
    .howto-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .howto-side > :first-child { margin-top: 0; }
    .howto-side > :last-child { margin-bottom: 0; }

    .steps { list-style: none; margin: 0; padding: 0; }

    .steps li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      margin: 0 0 12px;
    }

    .step-n {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--step-bg);
      color: var(--step-text);
      font-family: Rajdhani, sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .steps li div { padding-top: 4px; overflow-wrap: anywhere; }

    .shot, .banner { margin: 16px 0; }
    .shot img, .banner img { width: 100%; height: auto; border-radius: 12px; }
    .shot img { border: 1px solid var(--shot-border); }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .compare-col {
      padding: 16px 16px 8px;
      background: linear-gradient(180deg, var(--bg-top, var(--compare-bg-top)), var(--bg-bottom, var(--compare-bg-bottom)));
      border: 1px solid var(--bd, var(--compare-border));
      border-radius: 14px;
    }

    .compare-col.is-pro { --accent: var(--compare-pro); --bd: var(--compare-pro-border); --bg-top: var(--compare-pro-bg-top); --bg-bottom: var(--compare-pro-bg-bottom); border-top: 3px solid var(--compare-pro); }
    .compare-col.is-con { --accent: var(--compare-con); --bd: var(--compare-con-border); --bg-top: var(--compare-con-bg-top); --bg-bottom: var(--compare-con-bg-bottom); border-top: 3px solid var(--compare-con); }

    .soon { list-style: none; margin: 0; padding: 0; }

    .soon li {
      position: relative;
      margin: 0 0 8px;
      padding: 10px 12px 10px 36px;
      background: var(--soon-bg);
      border: 1px solid var(--soon-border);
      border-radius: 10px;
    }

    .soon li::before {
      content: "▸";
      position: absolute;
      left: 14px;
      color: var(--soon-marker);
    }

    .alert {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .alert p { margin: 0; }
    .alert-k {
      margin: 0 0 4px;
      font-family: Rajdhani, sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .alert-important { background: var(--alert-important-bg); border: 1px solid var(--alert-important-border); }
    .alert-important .alert-k { color: var(--alert-important-label); }
    .alert-warning { background: var(--alert-warning-bg); border: 1px solid var(--alert-warning-border); }
    .alert-warning .alert-k { color: var(--alert-warning-label); }
    .alert-note, .alert-tip { background: var(--alert-note-bg); border: 1px solid var(--alert-note-border); }
    .alert-note .alert-k, .alert-tip .alert-k { color: var(--alert-note-label); }
    .alert-caution { background: var(--alert-caution-bg); border: 1px solid var(--alert-caution-border); }
    .alert-caution .alert-k { color: var(--alert-caution-label); }

    .load-error {
      display: grid;
      grid-template-columns: var(--error-icon-size) minmax(0, 1fr);
      column-gap: 18px;
      align-items: center;
      margin-top: var(--feature-gap);
      padding: 14px 16px;
      border: 1px solid var(--error-border);
      border-radius: 12px;
      background: var(--error-bg);
    }

    .load-error[hidden] { display: none; }

        structure: (branch, count) => `В README.md ветки «${branch}» заголовков второго уровня: ${count}. Страница ждёт пять, в таком порядке: возможности, инструкция, сравнение, Cybershoke, Coming Soon. Дальнейшие блоки останутся пустыми, пока этих заголовков нет.`
      }
    };

    const FALLBACK_TITLE = "flobb's turnbinds";
    const FALLBACK_SUBTITLE = "Turnbinds with customizable turnspeeds for CS2/CSGO";

    const state = {
      lang: "en",
      branchNames: null,
      branchesOk: false,
      release: undefined,
      pushedAt: null,
      defaultBranch: "main",
      req: 0
    };

    function repoPath() {
      return encodeURIComponent(CONFIG.owner) + "/" + encodeURIComponent(CONFIG.repo);
    }

    function githubRepo() {
      return "https://github.com/" + CONFIG.owner + "/" + CONFIG.repo;
    }

    function readmeUrl(branch) {
      return "https://raw.githubusercontent.com/" + repoPath() + "/" + encodeURIComponent(branch) + "/README.md";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    function sanitizeUrl(url) {
      const clean = String(url || "").trim();
      if (/^https?:\/\//i.test(clean)) return clean;
      return "";
    }

    function tagAttr(tag, name) {
      const match = tag.match(new RegExp(name + "\\s*=\\s*(\"([^\"]*)\"|'([^']*)')", "i"));
      return match ? (match[2] != null ? match[2] : match[3]) : "";
    }

    function sanitizeImg(tag) {
      const src = sanitizeUrl(tagAttr(tag, "src"));
      if (!src) return "";
      const alt = tagAttr(tag, "alt");
      return '<img src="' + escapeAttr(src) + '" alt="' + escapeAttr(alt) + '" loading="lazy">';
    }

    /* Sternchen werden zu fett/kursiv. Unterstriche bleiben Zeichen,
       damit cl_yawspeed und Dateipfade nicht zerrissen werden.
       Erlaubt aus der README: <ins>, <img>, `code`, [Text](https://...). */
    // Inline-Code: Leerzeichen bekommen eine feste Breite (werden im Blocksatz nicht gedehnt, bleiben aber echte Leerzeichen
    // und werden beim Kopieren mitgenommen). Pfade (mit \\ oder /) brechen nur vor dem Schrägstrich, nie an Leerzeichen.
    function formatCode(code) {
      const isPath = /[\\/]/.test(code);
      const SP = '<span class="sp"> </span>';
      // Erst nach Zeichen trennen, dann zusammensetzen: so landet keine Ersetzung im HTML der anderen.
      return Array.from(code).map((ch) => {
        if (ch === " ") return isPath ? SP : SP + "<wbr>";
        if (ch === "\\" || ch === "/") return "<wbr>" + ch;
        return escapeHtml(ch);
      }).join("");
    }

    function formatInline(raw) {
      const slots = [];
      const keep = (html) => {
        slots.push(html);
        return "\u0000" + (slots.length - 1) + "\u0000";
      };

      let text = String(raw);
      text = text.replace(/<img\b[^>]*\/?>/gi, (tag) => keep(sanitizeImg(tag)));
      text = text.replace(/<\/?ins>/gi, (tag) => keep(tag.charAt(1) === "/" ? "</ins>" : "<ins>"));
      text = text.replace(/`([^`]+)`/g, (_, code) => keep("<code>" + formatCode(code) + "</code>"));
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (whole, label, url) => {
        const safe = sanitizeUrl(url);
        if (!safe) return whole;
        return keep('<a href="' + escapeAttr(safe) + '" target="_blank" rel="noopener">' + formatInline(label) + "</a>");
      });
      text = escapeHtml(text);
      text = text.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[^*])\*([^*]+)\*/g, (_, lead, body) => lead + "<em>" + body + "</em>");
      text = text.replace(/\u0000(\d+)\u0000/g, (_, index) => slots[Number(index)]);
      return text;
    }

    function formatLines(lines) {
      let html = "";
      lines.forEach((line, index) => {
        const breakAfter = /[ \t]{2}$/.test(line);
        html += formatInline(line.trim());
        if (index < lines.length - 1) html += breakAfter ? "<br>" : " ";
      });
      return html;
    }

    function isBlockStart(line) {
      const trimmed = line.trim();
      return /^#{1,6}\s+\S/.test(trimmed)
        || /^>\s?/.test(trimmed)
        || /^[-*]\s+\S/.test(trimmed)
        || /^\d+\.\s+\S/.test(trimmed)
        || /^<img\b/i.test(trimmed)
        || /^!\[[^\]]*\]\([^)]+\)\s*$/.test(trimmed)
        || trimmed.startsWith("```")
        || /^---+$/.test(trimmed);
    }

    function parseBlocks(markdown) {
      const lines = String(markdown).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      const blocks = [];
      let index = 0;

      while (index < lines.length) {
        const trimmed = lines[index].trim();
        if (trimmed === "") {
          index += 1;
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          blocks.push({ type: "heading", level: heading[1].length, text: heading[2].trim() });
          index += 1;
          continue;
        }

        if (trimmed.startsWith("```")) {
          const code = [];
          index += 1;
          while (index < lines.length && !lines[index].trim().startsWith("```")) {
            code.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          blocks.push({ type: "code", text: code.join("\n") });
          continue;
        }

        if (/^---+$/.test(trimmed)) {
          blocks.push({ type: "hr" });
          index += 1;
          continue;
        }

        if (/^<img\b/i.test(trimmed)) {
          const html = sanitizeImg(trimmed);
          if (html) blocks.push({ type: "img", html: html });
          index += 1;
          continue;
        }

        const mdImage = trimmed.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
        if (mdImage && sanitizeUrl(mdImage[2])) {
          blocks.push({
            type: "img",
            html: '<img src="' + escapeAttr(sanitizeUrl(mdImage[2])) + '" alt="' + escapeAttr(mdImage[1]) + '" loading="lazy">'
          });
          index += 1;
          continue;
        }

        if (/^>\s?/.test(trimmed)) {
          const quoted = [];
          while (index < lines.length && /^>\s?/.test(lines[index].trim())) {
            quoted.push(lines[index].trim().replace(/^>\s?/, ""));
            index += 1;
          }
          const marker = quoted[0].match(/^\[!(NOTE|IMPORTANT|WARNING|TIP|CAUTION)\](?:\s+([\s\S]*))?$/i);
          if (marker) {
            const body = [];
            if (marker[2] && marker[2].trim()) body.push(marker[2]);
            body.push(...quoted.slice(1));
            blocks.push({ type: "alert", kind: marker[1].toUpperCase(), lines: body.filter((line) => line.trim() !== "") });
          } else {
            blocks.push({ type: "quote", lines: quoted });
          }
          continue;
        }

        if (/^[-*]\s+\S/.test(trimmed) || /^\d+\.\s+\S/.test(trimmed)) {
          const ordered = /^\d+\.\s+\S/.test(trimmed);
          const items = [];
          while (index < lines.length && (ordered ? /^\d+\.\s+\S/.test(lines[index].trim()) : /^[-*]\s+\S/.test(lines[index].trim()))) {
            let item = lines[index].trim().replace(ordered ? /^\d+\.\s+/ : /^[-*]\s+/, "");
            index += 1;
            while (index < lines.length && /^[ \t]{2,}\S/.test(lines[index]) && !isBlockStart(lines[index].trim())) {
              item += " " + lines[index].trim();
              index += 1;
            }
            items.push(item);
          }
          blocks.push({ type: ordered ? "ol" : "ul", items: items });
          continue;
        }

        const paragraph = [];
        while (index < lines.length && lines[index].trim() !== "" && !isBlockStart(lines[index])) {
          paragraph.push(lines[index]);
          index += 1;
        }
        blocks.push({ type: "p", lines: paragraph });
      }

      return blocks;
    }

    function structureReadme(blocks) {
      const h1 = [];
      const intro = [];
      const sections = [];
      let section = null;
      let subsection = null;

      blocks.forEach((block) => {
        if (block.type === "heading" && block.level === 1) {
          h1.push(block.text);
          subsection = null;
          return;
        }
        if (block.type === "heading" && block.level === 2) {
          section = { title: block.text, lead: [], subsections: [] };
          sections.push(section);
          subsection = null;
          return;
        }
        if (block.type === "heading" && block.level === 3 && section) {
          subsection = { title: block.text, blocks: [] };
          section.subsections.push(subsection);
          return;
        }
        if (block.type === "heading" && block.level > 3 && section) {
          const target = subsection ? subsection.blocks : section.lead;
          target.push({ type: "p", lines: ["**" + block.text + "**"] });
          return;
        }
        if (!section) intro.push(block);
        else if (subsection) subsection.blocks.push(block);
        else section.lead.push(block);
      });

      return { h1: h1, intro: intro, sections: sections };
    }

    function renderBlock(block, options) {
      if (block.type === "p") return "<p>" + formatLines(block.lines) + "</p>";
      if (block.type === "ul") {
        const cls = options.soon ? ' class="soon"' : "";
        return "<ul" + cls + ">" + block.items.map((item) => "<li>" + formatInline(item) + "</li>").join("") + "</ul>";
      }
      if (block.type === "ol") {
        if (options.steps) {
          return '<ol class="steps">' + block.items.map((item, index) => {
            return '<li><span class="step-n">' + (index + 1) + "</span><div>" + formatInline(item) + "</div></li>";
          }).join("") + "</ol>";
        }
        return "<ol>" + block.items.map((item) => "<li>" + formatInline(item) + "</li>").join("") + "</ol>";
      }
      if (block.type === "alert") {
        const label = (UI[state.lang].alert && UI[state.lang].alert[block.kind]) || block.kind;
        return '<aside class="alert alert-' + block.kind.toLowerCase() + '"><p class="alert-k">' + escapeHtml(label) + "</p><p>" + formatLines(block.lines) + "</p></aside>";
      }
      if (block.type === "img") return '<figure class="' + (options.banner ? "banner" : "shot") + '">' + block.html + "</figure>";
      if (block.type === "quote") return "<blockquote><p>" + formatLines(block.lines) + "</p></blockquote>";
      if (block.type === "code") return "<pre><code>" + escapeHtml(block.text) + "</code></pre>";
      if (block.type === "hr") return "<hr>";
      if (block.type === "heading") {
        const level = Math.min(block.level, 6);
        return "<h" + level + ">" + formatInline(block.text) + "</h" + level + ">";
      }
      return "";
    }

    function renderBlocks(blocks, options) {
      return blocks.map((block) => renderBlock(block, options || {})).join("");
    }

    function hideReadme() {
      ["features", "howto", "compare", "thanks", "soon"].forEach((id) => {
        const el = document.getElementById(id);
        el.hidden = true;
        el.innerHTML = "";
      });
      document.getElementById("extra").innerHTML = "";
      document.getElementById("structure-note").hidden = true;
    }

    function renderReadme(markdown) {
      const doc = structureReadme(parseBlocks(markdown));
      document.getElementById("page-title").textContent = doc.h1[0] || FALLBACK_TITLE;
      document.getElementById("page-subtitle").textContent = doc.h1[1] || FALLBACK_SUBTITLE;
      document.title = doc.h1[0] || FALLBACK_TITLE;
      document.getElementById("intro").innerHTML = renderBlocks(doc.intro);
      document.getElementById("readme-error").hidden = true;

      const sections = doc.sections;
      const note = document.getElementById("structure-note");
      if (sections.length < 5) {
        const branch = CONFIG.languages[state.lang].branch;
        note.hidden = false;
        note.textContent = UI[state.lang].structure(branch, sections.length);
      } else {
        note.hidden = true;
      }

      fillSection("features", sections[0], (section) => {
        const cards = section.subsections.map((sub) => {
          return '<article class="card"><h3>' + formatInline(sub.title) + "</h3>" + renderBlocks(sub.blocks) + "</article>";
        }).join("");
        return "<h2>" + formatInline(section.title) + "</h2>" + renderBlocks(section.lead) + '<div class="cards">' + cards + "</div>";
      });

      fillSection("howto", sections[1], (section) => {
        /* Links: Text und Schritte. Rechts: Bilder (Screenshot) und Hinweis-Boxen darunter. */
        const all = section.lead.slice();
        section.subsections.forEach((sub) => {
          all.push({ type: "heading", level: 3, text: sub.title });
          sub.blocks.forEach((block) => all.push(block));
        });
        const isSide = (block) => block.type === "img" || block.type === "alert";
        const main = all.filter((block) => !isSide(block));
        const side = all.filter(isSide);
        const head = "<h2>" + formatInline(section.title) + "</h2>";
        if (side.length === 0) return head + renderBlocks(main, { steps: true });
        return head + '<div class="howto-grid"><div class="howto-main">' + renderBlocks(main, { steps: true })
          + '</div><div class="howto-side">' + renderBlocks(side, { steps: true }) + "</div></div>";
      });

      fillSection("compare", sections[2], (section) => {
        const columns = section.subsections.slice(0, 2).map((sub, index) => {
          const side = index === 0 ? "is-pro" : "is-con";
          return '<article class="compare-col ' + side + '"><h3>' + formatInline(sub.title) + "</h3>" + renderBlocks(sub.blocks) + "</article>";
        }).join("");
        const more = section.subsections.slice(2).map((sub) => {
          return "<h3>" + formatInline(sub.title) + "</h3>" + renderBlocks(sub.blocks);
        }).join("");
        return "<h2>" + formatInline(section.title) + "</h2>" + renderBlocks(section.lead) + '<div class="compare">' + columns + "</div>" + more;
      });

      fillSection("thanks", sections[3], (section) => simpleSection(section, { banner: true }));
      fillSection("soon", sections[4], (section) => simpleSection(section, { soon: true }));

      document.getElementById("extra").innerHTML = sections.slice(5).map((section) => {
        return '<section class="readme-section extra-block">' + simpleSection(section, {}) + "</section>";
      }).join("");
    }

    function simpleSection(section, options) {
      const subs = section.subsections.map((sub) => {
        return "<h3>" + formatInline(sub.title) + "</h3>" + renderBlocks(sub.blocks, options);
      }).join("");
      return "<h2>" + formatInline(section.title) + "</h2>" + renderBlocks(section.lead, options) + subs;
    }

    function fillSection(id, section, build) {
      const el = document.getElementById(id);
      if (!section) {
        el.hidden = true;
        el.innerHTML = "";
        return;
      }
      el.hidden = false;
      el.innerHTML = build(section);
    }

    function showReadmeError(kind, branch, detail) {
      hideReadme();
      document.getElementById("intro").innerHTML = "";
      document.getElementById("page-title").textContent = FALLBACK_TITLE;
      document.getElementById("page-subtitle").textContent = "";
      document.title = FALLBACK_TITLE;
      const box = document.getElementById("readme-error");
      box.hidden = false;
      box.innerHTML = errorCopy(kind, branch, detail);

    function applyChrome() {
      const ui = UI[state.lang];
      document.documentElement.lang = state.lang;
      document.getElementById("about").textContent = ABOUT[state.lang];
      document.querySelector('meta[name="description"]').setAttribute("content", ABOUT[state.lang]);
      document.getElementById("lang-switch").setAttribute("aria-label", ui.language);
      document.getElementById("label-stars").textContent = ui.stars;
      document.getElementById("label-branches").textContent = ui.branches;
      document.getElementById("label-release").textContent = ui.release;
      document.getElementById("release-cta").textContent = ui.download;
      document.getElementById("label-updated").textContent = ui.updated;
      document.querySelectorAll(".flag-btn").forEach((button) => {
        const on = button.dataset.lang === state.lang;
        button.classList.toggle("is-active", on);
        button.setAttribute("aria-pressed", on ? "true" : "false");
      });
      const preview = document.querySelector("#preview-slot svg");
      if (preview) {
        const labels = {
          en: "Turnbind preview placeholder",
          de: "Platzhalter für die Turnbind-Vorschau",
          ru: "Заглушка превью turnbind"
        };
        preview.setAttribute("aria-label", labels[state.lang]);
      }
      paintStats();

    function paintStats() {
      const ui = UI[state.lang];
      const stars = document.getElementById("stars-value");
      const release = document.getElementById("release-value");
      const updated = document.getElementById("updated-value");
      const branchList = document.getElementById("branch-list");
      const releaseLink = document.getElementById("stat-release");
      const updatedLink = document.getElementById("stat-updated");

      if (!state.branchesOk && state.branchNames === null && state.pushedAt === null && state.release === undefined) {
        return;
      }

      if (typeof state.stars === "number") {
        stars.textContent = new Intl.NumberFormat(ui.locale).format(state.stars);
      } else {
        stars.textContent = "—";
      }

      if (state.branchesOk) {
        branchList.innerHTML = state.branchNames.map((name) => {
          const href = githubRepo() + "/tree/" + encodeURIComponent(name);
          return '<a href="' + escapeAttr(href) + '">' + escapeHtml(name) + "</a>";
        }).join("");
      } else {
        branchList.textContent = ui.statsError;
      }

      if (state.release) {
        release.textContent = state.release.tag;
        releaseLink.href = state.release.url;
      } else if (state.release === null) {
        release.textContent = ui.noRelease;
        releaseLink.href = githubRepo() + "/releases";
      }

      if (state.pushedAt) {
        const formatted = new Intl.DateTimeFormat(ui.locale, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(state.pushedAt));
        updated.textContent = formatted;
        updated.setAttribute("datetime", state.pushedAt);
        updatedLink.href = githubRepo() + "/commits/" + encodeURIComponent(state.defaultBranch);
      } else if (state.statsFailed) {
        updated.textContent = "—";
      }
    }

    let statsPromise = null;

    function loadStats() {
      if (!statsPromise) statsPromise = fetchStats();
      return statsPromise;
    }

    async function fetchStats() {
      const live = document.getElementById("live");
      const headers = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
      try {
        const [repoRes, branchRes, releaseRes] = await Promise.all([
          fetch("https://api.github.com/repos/" + repoPath(), { headers: headers, cache: "no-store" }),
          fetch("https://api.github.com/repos/" + repoPath() + "/branches?per_page=100", { headers: headers, cache: "no-store" }),
          fetch("https://api.github.com/repos/" + repoPath() + "/releases/latest", { headers: headers, cache: "no-store" })
        ]);

        if (repoRes.ok) {
          const repo = await repoRes.json();
          state.stars = repo.stargazers_count;
          state.pushedAt = repo.pushed_at;
          state.defaultBranch = repo.default_branch || "main";
        } else {
          state.statsFailed = true;
        }

        if (branchRes.ok) {
          const branches = await branchRes.json();
          state.branchNames = branches.map((branch) => branch.name).sort((a, b) => {
            if (a === state.defaultBranch) return -1;
            if (b === state.defaultBranch) return 1;
            return a.localeCompare(b);
          });
          state.branchesOk = true;
        } else {
          state.branchesOk = false;
          state.branchNames = [];
          state.statsFailed = true;
        }

        if (releaseRes.ok) {
          const release = await releaseRes.json();
          state.release = { tag: release.tag_name, url: release.html_url };
        } else if (releaseRes.status === 404) {
          state.release = null;
        } else {
          state.release = null;
          state.statsFailed = true;
        }
      } catch (err) {
        state.statsFailed = true;
        state.branchesOk = false;
        state.branchNames = [];
        state.release = null;
      }
      live.setAttribute("aria-busy", "false");
      paintStats();
    }

    async function loadReadme(lang) {
      const requestId = ++state.req;
      const branch = CONFIG.languages[lang].branch;
      document.getElementById("intro").innerHTML = '<p class="loading">' + escapeHtml(UI[lang].loading) + "</p>";
      document.getElementById("readme-error").hidden = true;

      let response;
      try {
        response = await fetch(readmeUrl(branch) + "?cb=" + Date.now(), { cache: "no-store" });
      } catch (err) {
        await loadStats();
        if (requestId !== state.req) return;
        showReadmeError("network", branch, err && err.message ? err.message : "");
        return;
      }

      await loadStats();
      if (requestId !== state.req) return;

      if (state.branchesOk && state.branchNames.indexOf(branch) === -1) {
        showReadmeError("branch", branch);
        return;
      }
      if (requestId !== state.req) return;

      if (response.status === 404) {
        showReadmeError(state.branchesOk ? "file" : "network", branch, state.branchesOk ? "" : "HTTP 404");
        if (!state.branchesOk) {
          const box = document.getElementById("readme-error");
          const extra = {
            en: "The branch list could not be loaded either, so this can mean two different things: the branch \"" + branch + "\" is missing, or the branch exists and the file README.md is missing.",
            de: "Die Branch-Liste konnte zusätzlich nicht geladen werden. Deshalb kann zweierlei fehlen: der Branch „" + branch + "“ oder, falls der Branch existiert, die Datei README.md darin.",
            ru: "Список веток тоже не загрузился. Поэтому неясно, чего именно нет: ветки «" + branch + "» или, если ветка есть, файла README.md в ней."
          };
          box.insertAdjacentHTML("beforeend", "<p>" + escapeHtml(extra[lang]) + "</p>");
        }
        return;
      }

      if (!response.ok) {
        showReadmeError("network", branch, "HTTP " + response.status);
        return;
      }

      const markdown = await response.text();
      if (requestId !== state.req) return;
      if (!markdown.trim()) {
        showReadmeError("empty", branch);
        return;
      }
      renderReadme(markdown);
    }

    function initialLang() {
      const fromHash = location.hash.replace(/^#/, "");
      if (CONFIG.languages[fromHash]) return fromHash;
      return "en";
    }

    function setLang(lang, options) {
      if (!CONFIG.languages[lang]) lang = "en";
      state.lang = lang;
      if (!options || !options.fromHash) {
        const base = location.pathname + location.search;
        const url = lang === "en" ? (base || "./") : base + "#" + lang;
        history.pushState(null, "", url);
      }
      applyChrome();
      loadReadme(lang);
    }

    function applyFavicon() {
      const css = getComputedStyle(document.documentElement);
      const bg = css.getPropertyValue("--favicon-bg").trim();
      const line = css.getPropertyValue("--favicon-line").trim();
      const link = document.querySelector('link[rel="icon"]');
      if (!bg || !line || !link) return;
      const img = new Image();
      img.onload = () => {
        try {
          const S = 64;
          const c = document.createElement("canvas");
          c.width = c.height = S;
          const g = c.getContext("2d");
          g.fillStyle = bg;
          g.beginPath();
          if (g.roundRect) g.roundRect(0, 0, S, S, 12); else g.rect(0, 0, S, S);
          g.fill();
          const t = document.createElement("canvas");
          t.width = t.height = S;
          const tg = t.getContext("2d");
          const k = (S - 16) / Math.max(img.width, img.height);
          const w = img.width * k;
          const h = img.height * k;
          tg.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          tg.globalCompositeOperation = "source-in";
          tg.fillStyle = line;
          tg.fillRect(0, 0, S, S);
          g.drawImage(t, 0, 0);
          link.setAttribute("href", c.toDataURL("image/png"));
        } catch (e) { /* bleibt beim eingebauten Favicon */ }
      };
      img.src = CROWN_MASK;
    }

    /* Sprachnamen angleichen (misst mit der geladenen Schrift): Die Großbuchstaben aller Namen sollen gleich hoch sein.
       Die Schrift hat keine kyrillischen Buchstaben, der Browser nimmt dafür eine Ersatzschrift mit anderen Proportionen.
       Läuft nach dem Laden der Schrift und beim Ändern der Fenstergröße. */
    function fitFlags() {
      const labels = Array.from(document.querySelectorAll("#lang-switch .lang-name"));
      if (labels.length === 0) return;
      const ctx = document.createElement("canvas").getContext("2d");

      // Messen bei 200px und auf die echte Größe umrechnen (bei kleinen Größen rundet der Browser grob)
      const MEAS = 200;
      const capHeight = (el, text) => {
        const cs = getComputedStyle(el);
        ctx.font = cs.fontStyle + " " + cs.fontWeight + " " + MEAS + "px " + cs.fontFamily;
        return ctx.measureText(text).actualBoundingBoxAscent * parseFloat(cs.fontSize) / MEAS;
      };

      const sample = (el) => (/[\u0400-\u04FF]/.test(el.textContent) ? "\u041d" : "H");
      labels.forEach((l) => l.closest(".flag-btn").style.removeProperty("--ln-scale"));
      const capRef = capHeight(labels[0], sample(labels[0]));
      if (!capRef) return;
      labels.forEach((l) => {
        const cap = capHeight(l, sample(l));
        if (cap) l.closest(".flag-btn").style.setProperty("--ln-scale", (capRef / cap).toFixed(3));
      });
    }

    function init() {
      applyFavicon();
      fitFlags();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitFlags);
      window.addEventListener("resize", fitFlags);
      document.getElementById("lang-switch").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-lang]");
        if (!button || button.dataset.lang === state.lang) return;
        setLang(button.dataset.lang);
      });
      window.addEventListener("hashchange", () => {
        const lang = initialLang();
        if (lang !== state.lang) setLang(lang, { fromHash: true });
      });
      applyChrome();
      setLang(initialLang(), { fromHash: true });
    }

    if (typeof document !== "undefined") init();
  </script>
