//	turnup/turndown. Чтобы снова отключить её, добавьте // в начало обеих строк.

//bind "[key]" "+turnup_custom";
//bind "[key]" "+turndown_custom";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Шаг #1.2 - cl_yawspeed (turnleft/turnright)	————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Yawspeed измеряется в градусах в секунду и может быть любым целым числом от 1 до 300.
//	Этот конфиг позволяет менять yawspeed, вводя "cl_yawspeed_[value]" в консоль разработчика
//	или выполняя эту команду в ".cfg"-файле. Эта команда не влияет на бинды yawspeed (шаг #2).
//	Она включена по умолчанию и задаёт начальный yawspeed для клавиш turnleft/turnright.
//	Чтобы изменить значение по умолчанию, отредактируйте следующую команду.

cl_yawspeed_300;



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Шаг #1.3 - cl_pitchspeed (turnup/turndown)	————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Pitchspeed измеряется в градусах в секунду и может быть любым целым числом от 1 до 45.
//	Этот конфиг позволяет менять pitchspeed, вводя "cl_pitchspeed_[value]" в консоль разработчика
//	или выполняя эту команду в ".cfg"-файле. Эта команда не влияет на бинды pitchspeed (шаг #3).
//	Она включена по умолчанию и задаёт начальный pitchspeed для клавиш turnup/turndown.
//	Чтобы изменить значение по умолчанию, отредактируйте следующую команду.

cl_pitchspeed_45;



