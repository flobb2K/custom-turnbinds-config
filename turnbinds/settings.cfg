//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Шаг #1.1.1 - turnleft/turnright	————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Это клавиши для поворота влево и вправо. Чаще всего используют MOUSE1/MOUSE2, Q/E или MOUSE4/MOUSE5.
//	Если вам не нравятся клавиши по умолчанию, замените "MOUSE1/MOUSE2" на предпочитаемые клавиши 
//	turnleft/turnright. Эта опция включена по умолчанию. Чтобы отключить её, добавьте // в начало обеих строк.

bind "MOUSE1" "+turnleft_custom";
bind "MOUSE2" "+turnright_custom";



