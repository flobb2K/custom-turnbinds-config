//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Hold-to-Activate Binds müssen gedrückt gehalten werden, um die cl_yawspeed-Einstellung zu ändern. Solange
//	keiner dieser Binds gehalten wird, ist eine anpassbare Standard-cl_yawspeed-Einstellung aktiv (alias speed1).
//	Diese Config unterstützt bis zu drei Hold-to-Activate Binds, die zusammen mit der Standardeinstellung bis zu
//	vier verschiedene Geschwindigkeitseinstellungen ergeben. Diese Binds lassen sich nicht mit den Binds aus
//	Schritt #2.1 und #2.2 kombinieren. Um sie zu aktivieren, wähle zuerst, wie viele Hold-to-Activate Binds du
//	verwenden möchtest, und entferne // bei der gleichen Anzahl an bind-Befehlen. Ersetze danach "[key]" durch
//	deine bevorzugten Tasten und ändere die cl_yawspeed-Werte. Um sie wieder zu deaktivieren, setze // an den
//	Anfang jeder Zeile.

//bind "[key]" "+speed_key1"; speed1;
//bind "[key]" "+speed_key2"; speed1;
//bind "[key]" "+speed_key3"; speed1;

//	—————	Standardgeschwindigkeit	————————————————————————————————————————————————————————————————————————————

alias "speed1" "cl_yawspeed_60";

//	—————	Aktiviert durch "+speed_key1"	————————————————————————————————————————————————————————————————————

alias "speed2" "cl_yawspeed_300";

//	—————	Aktiviert durch "+speed_key2"	————————————————————————————————————————————————————————————————————

alias "speed3" "cl_yawspeed_210";

//	—————	Aktiviert durch "+speed_key3"	————————————————————————————————————————————————————————————————————

alias "speed4" "cl_yawspeed_120";



