//	To disable it again, add // to the start of the first line.

//bind "[key]" "4yaw_cycle"; 4yaw_cycle;

alias "4yawspeed1" "cl_yawspeed_300";
alias "4yawspeed2" "cl_yawspeed_210";
alias "4yawspeed3" "cl_yawspeed_120";
alias "4yawspeed4" "cl_yawspeed_60";



