//	Verwende diese Datei, um cl_yawspeed/cl_pitchspeed zu ändern, verschiedene Arten von Binds einzurichten
//	und weitere Anpassungen vorzunehmen.

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	- Schritt #1: Grundeinrichtung (Turnkeys, cl_yawspeed/cl_pitchspeed)
//	- Schritt #2: Yawspeed während des Spiels ändern (Yawspeed-Binds)
//	- Schritt #3: Pitchspeed während des Spiels ändern (Pitchspeed-Binds)
//	- Schritt #4: Farbwechsel zu deinen Binds hinzufügen (visuelles Feedback)
//	- Schritt #5: Soundeffekte zu deinen Binds hinzufügen (akustisches Feedback)
