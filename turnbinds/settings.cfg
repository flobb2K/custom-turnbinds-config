//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1 - Grundeinrichtung	————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1.1 - Turnkeys	————————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1.1.1 - turnleft/turnright	————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Das sind die Tasten zum Drehen nach links und rechts. Die meisten verwenden MOUSE1/MOUSE2, Q/E oder
//	MOUSE4/MOUSE5. Wenn dir die Standardtasten nicht gefallen, ersetze "MOUSE1/MOUSE2" durch deine bevorzugten
//	turnleft/turnright-Tasten. Diese Option ist standardmäßig aktiviert.
//	Um sie zu deaktivieren, setze // an den Anfang beider Zeilen.

bind "MOUSE1" "+turnleft_custom";
bind "MOUSE2" "+turnright_custom";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1.1.2 - turnup/turndown	————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Das sind die Tasten zum Hoch- und Runterschauen. Diese Option ist standardmäßig deaktiviert.
//	Um sie zu aktivieren, entferne // am Anfang beider Zeilen und ersetze "[key]" durch deine bevorzugten
//	turnup/turndown-Tasten. Um sie wieder zu deaktivieren, setze // an den Anfang beider Zeilen.

//bind "[key]" "+turnup_custom";
//bind "[key]" "+turndown_custom";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1.2 - cl_yawspeed (turnleft/turnright)	————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Yawspeed wird in Grad pro Sekunde gemessen und kann auf einen beliebigen ganzzahligen Wert von 1 bis 300
//	gesetzt werden. Diese Config ermöglicht es, den Yawspeed zu ändern, indem du "cl_yawspeed_[value]" in die
//	Entwicklerkonsole eingibst oder in einer ".cfg"-Datei ausführst. Dieser Befehl hat keinen Einfluss auf die
//	Yawspeed-Binds (Schritt #2). Er ist standardmäßig aktiviert und legt den Start-Yawspeed für die
//	turnleft/turnright-Tasten fest. Um den Standardwert zu ändern, bearbeite den folgenden Befehl.

cl_yawspeed_300;



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Schritt #1.3 - cl_pitchspeed (turnup/turndown)	————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Pitchspeed wird in Grad pro Sekunde gemessen und kann auf einen beliebigen ganzzahligen Wert von 1 bis 45
//	gesetzt werden. Diese Config ermöglicht es, den Pitchspeed zu ändern, indem du "cl_pitchspeed_[value]" in
//	die Entwicklerkonsole eingibst oder in einer ".cfg"-Datei ausführst. Dieser Befehl hat keinen Einfluss auf
//	die Pitchspeed-Binds (Schritt #3). Er ist standardmäßig aktiviert und legt den Start-Pitchspeed für die
//	turnup/turndown-Tasten fest. Um den Standardwert zu ändern, bearbeite den folgenden Befehl.

cl_pitchspeed_45;



