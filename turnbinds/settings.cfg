//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Hier kannst du eine Taste belegen, die zwischen zwei verschiedenen cl_yawspeed-Werten wechselt.
//	Um den Bind zu aktivieren, entferne // am Anfang der ersten Zeile und ersetze "[key]" durch deine bevorzugte
//	Taste. Ändere danach die cl_yawspeed-Werte in der zweiten und dritten Zeile nach Belieben.
//	Um den Bind wieder zu deaktivieren, setze // an den Anfang der ersten Zeile.

//bind "[key]" "2yaw_cycle"; 2yaw_cycle;

alias "2yawspeed1" "cl_yawspeed_300";
alias "2yawspeed2" "cl_yawspeed_60";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
