//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1 - Basic Setup	————————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.1 - Turnkeys	————————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.1.1 - turnleft/turnright	————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	These are the keys used to turn left and right. Most people use MOUSE1/MOUSE2, Q/E, or MOUSE4/MOUSE5.
//	If you don't like the default keys, replace "MOUSE1/MOUSE2" with your preferred turnleft/turnright keys.
//	This option is enabled by default. To disable it, add // to the start of both lines.

bind "MOUSE1" "+turnleft_custom";
bind "MOUSE2" "+turnright_custom";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.1.2 - turnup/turndown	————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	These are the keys used to look up and down. This option is disabled by default.
//	To enable it, remove // from the start of both lines and replace "[key]" with your preferred turnup/turndown
//	keys. To disable it again, add // to the start of both lines.

//bind "[key]" "+turnup_custom";
//bind "[key]" "+turndown_custom";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.2 - cl_yawspeed (turnleft/turnright)	————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Yawspeed is measured in degrees per second and can be set to any whole number from 1 to 300.
//	This config allows the user to change yawspeed by entering "cl_yawspeed_[value]" into the developer console
//	or by executing it in a ".cfg" file. This command does not affect the yawspeed binds (Step #2).
//	It is enabled by default and sets the starting yawspeed for the turnleft/turnright keys.
//	To change the default value, edit the following command.

cl_yawspeed_300;



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.3 - cl_pitchspeed (turnup/turndown)	————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Pitchspeed is measured in degrees per second and can be set to any whole number from 1 to 45.
//	This config allows the user to change pitchspeed by entering "cl_pitchspeed_[value]" into the developer
//	console or by executing it in a ".cfg" file. This command does not affect the pitchspeed binds (Step #3).
//	It is enabled by default and sets the starting pitchspeed for the turnup/turndown keys.
//	To change the default value, edit the following command.

cl_pitchspeed_45;



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #2 - Change cl_yawspeed during gameplay (turnleft/turnright)	————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #2.1 - Fixed cl_yawspeed Binds	————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	This is the simplest way to bind cl_yawspeed to a key. To enable it, first choose how many of these
//	Fixed Binds you want to use and remove // from the same number of bind commands.
//	Then replace "[key]" with your preferred keys and change the cl_yawspeed values to your liking.
//	To disable them again, add // to the start of every line.

//bind "[key]" "cl_yawspeed_300";
//bind "[key]" "cl_yawspeed_270";
//bind "[key]" "cl_yawspeed_240";
//bind "[key]" "cl_yawspeed_210";
//bind "[key]" "cl_yawspeed_180";
//bind "[key]" "cl_yawspeed_150";
//bind "[key]" "cl_yawspeed_120";
//bind "[key]" "cl_yawspeed_90";
//bind "[key]" "cl_yawspeed_60";
//bind "[key]" "cl_yawspeed_30";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #2.2 - Toggle/Cycle cl_yawspeed Binds	————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Toggle/Cycle Binds allow you to switch between two, three, or four cl_yawspeed settings using a single key.
//	After loading the config, a Toggle/Cycle Bind needs to be pressed once to start the cycle.
//	Every subsequent press advances the cycle to the next setting.

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #2.2.1 - Two cl_yawspeed settings using a single key	————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Here you can bind a key that cycles between two different cl_yawspeed values.
//	To enable it, remove // from the first line and replace "[key]" with your preferred key.
//	Then change the cl_yawspeed values in the second and third lines to your liking.
//	To disable it again, add // to the start of the first line.

//bind "[key]" "2yaw_cycle"; 2yaw_cycle;

alias "2yawspeed1" "cl_yawspeed_300";
alias "2yawspeed2" "cl_yawspeed_60";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #2.2.2 - Three cl_yawspeed settings using a single key	————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Here you can bind a key that cycles between three different cl_yawspeed values.
//	To enable it, remove // from the first line and replace "[key]" with your preferred key.
//	Then change the cl_yawspeed values in the second, third, and fourth lines to your liking.
//	To disable it again, add // to the start of the first line.

//bind "[key]" "3yaw_cycle"; 3yaw_cycle;

alias "3yawspeed1" "cl_yawspeed_300";
alias "3yawspeed2" "cl_yawspeed_180";
alias "3yawspeed3" "cl_yawspeed_60";



//	————————————————————————————————————————————————————————————————————————————————————————————————————————————
