//	Вы можете добавлять в свои бинды смену цвета HUD и/или прицела для визуальной обратной связи.
//	Я максимально точно подобрал цвета прицела под стандартные цвета HUD.
//	Чтобы изменить цвета прицела самостоятельно, отредактируйте файл "turnbinds\setup\setup.cfg".
//	В нём есть дополнительные инструкции. В Counter-Strike: Global Offensive смена цвета прицела работает только
//	после редактирования файла "turnbinds\setup\setup.cfg".
//	Чтобы изменить цвет HUD, добавьте "cl_hud_color [number]".
//	Чтобы изменить цвет прицела, добавьте "crosshair_color_[number]".
//	Чтобы изменить и цвет прицела, и цвет HUD, добавьте "crosshair_hud_color_[number]".
//	Цвета: 2=белый, 3=голубой, 4=синий, 5=фиолетовый, 6=красный, 7=оранжевый, 8=жёлтый, 9=зелёный, 10=бирюзовый, 11=розовый
