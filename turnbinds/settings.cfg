//	—————	Schritt #4 - Farbwechsel zu deinen Binds hinzufügen (visuelles Feedback)	————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Du kannst deinen Binds HUD- und/oder Fadenkreuz-Farbwechsel als visuelles Feedback hinzufügen. Ich habe die
//	Fadenkreuzfarben so genau wie möglich an die Standard-HUD-Farben angepasst. Um die Fadenkreuzfarben selbst
//	zu ändern, bearbeite die Datei "turnbinds\setup\setup.cfg". Sie enthält weitere Anweisungen. In
//	Counter-Strike: Global Offensive funktioniert der Fadenkreuz-Farbwechsel nur, wenn du sie zuvor bearbeitest.
//	Um die HUD-Farbe zu ändern, füge "cl_hud_color [number]" hinzu.
//	Um die Fadenkreuzfarbe zu ändern, füge "crosshair_color_[number]" hinzu.
//	Um sowohl die Fadenkreuz- als auch die HUD-Farbe zu ändern, füge "crosshair_hud_color_[number]" hinzu.
//	Farben: 2=Weiß, 3=Hellblau, 4=Blau, 5=Lila, 6=Rot, 7=Orange, 8=Gelb, 9=Grün, 10=Türkis, 11=Pink
//	Weitere Informationen und Codebeispiele findest du in Schritt #6.



