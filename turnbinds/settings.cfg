//	Use this file to change cl_yawspeed/cl_pitchspeed, set up various types of binds,
//	and add further customization.

//	————————————————————————————————————————————————————————————————————————————————————————————————————————————

//	- Step #1: Basic Setup (Turnkeys, cl_yawspeed/cl_pitchspeed)
//	- Step #2: Change yawspeed during gameplay (yawspeed binds)
//	- Step #3: Change pitchspeed during gameplay (pitchspeed binds)
//	- Step #4: Add color changes to your binds (visual feedback)
//	- Step #5: Add sound effects to your binds (audio feedback)
