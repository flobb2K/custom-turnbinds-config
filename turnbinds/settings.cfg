//	Hold-to-Activate Binds must be held down to change the cl_yawspeed setting.
//	While none of these binds is held, a customizable default cl_yawspeed setting is active (alias speed1).
//	This config supports up to three Hold-to-Activate Binds, which, together with the default setting,
//	give you up to four different speed settings.
//	These binds cannot be combined with the binds from Step #2.1 and Step #2.2. To enable them, first choose
//	how many Hold-to-Activate Binds you want to use and remove // from the same number of bind commands.
//	Then replace "[key]" with your preferred keys and change the cl_yawspeed values.
//	To disable them again, add // to the start of every line.

//bind "[key]" "+speed_key1"; speed1;
//bind "[key]" "+speed_key2"; speed1;
//bind "[key]" "+speed_key3"; speed1;

//	—————	Default speed	————————————————————————————————————————————————————————————————————————————————————

alias "speed1" "cl_yawspeed_60";

//	—————	Activated by "+speed_key1"	————————————————————————————————————————————————————————————————————————

alias "speed2" "cl_yawspeed_300";

//	—————	Activated by "+speed_key2"	————————————————————————————————————————————————————————————————————————

alias "speed3" "cl_yawspeed_210";

//	—————	Activated by "+speed_key3"	————————————————————————————————————————————————————————————————————————

alias "speed4" "cl_yawspeed_120";



